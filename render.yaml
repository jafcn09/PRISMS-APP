services:
  - type: web
    name: prism-pr-analyzer
    env: node
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: info
      - key: MAX_CONCURRENT_ANALYSES
        value: 3
      - key: CACHE_TTL
        value: 3600
      - key: ENABLE_SECURITY_ANALYSIS
        value: "true"
      - key: ENABLE_PERFORMANCE_ANALYSIS
        value: "true"
      - key: ENABLE_COMPLEXITY_ANALYSIS
        value: "true"
      - key: ENABLE_SEMANTIC_ANALYSIS
        value: "true"